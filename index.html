<!doctype html>
<html lang="uk">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151916">
<title>Форма — щоденник тренувань</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5ef;color:#20251f;font:15px system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 17px;background:#e8ebe2;color:inherit;font-weight:650}button:hover{filter:brightness(.95)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #679b37;outline-offset:2px}input,select{border:1px solid #d8ddcf;background:#fff;border-radius:9px;padding:10px;min-width:0;color:inherit}header{background:#151916;color:white;padding:23px 5%;display:flex;align-items:center;justify-content:space-between}.brand{font-size:25px;font-weight:850;letter-spacing:3px}.brand span{color:#c3ee77}.badge{font-size:12px;color:#d2dacb;border:1px solid #46503f;border-radius:30px;padding:8px 12px}main{max-width:1050px;margin:auto;padding:34px 24px 100px}nav{display:flex;gap:8px;margin-bottom:36px;flex-wrap:wrap}nav button{background:transparent;color:#65705f}nav button.active{background:#20271f;color:white}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#69755f;font-weight:750}h1{font-size:clamp(30px,5vw,44px);letter-spacing:-1.8px;margin:10px 0}h2{font-size:20px;margin:0 0 8px}p{line-height:1.6;color:#6b7464}.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:20px 0 30px}.primary{background:#c3ee77;color:#233313}.dark{background:#20271f;color:white}.card{background:#fff;border:1px solid #e0e4d9;border-radius:20px;padding:24px;margin-bottom:18px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.cards .card{margin:0}.muted{color:#74806c;font-size:13px}.big{font-size:32px;font-weight:750;letter-spacing:-1px;margin:10px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.subtle{background:transparent;color:#718166;padding:8px}.danger{color:#a64936;background:#fff0eb}.workout-name{font-size:24px;font-weight:700;width:100%;border:0;background:transparent;padding:0;margin-bottom:8px}.exercise{margin-top:20px}.exercise-head{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:18px}.exercise-head strong{font-size:18px}.set{display:grid;grid-template-columns:35px 1fr 1fr 48px 30px;gap:9px;align-items:center;padding:6px 0}.set input{text-align:center;width:100%}.set.done input{background:#f0f7e7;color:#526444}.check{padding:10px;background:#edf0e8}.done .check{background:#c3ee77}.label{font-size:11px;color:#7d8774;text-transform:uppercase;letter-spacing:1px}.timer{position:sticky;bottom:18px;background:#20271f;color:white;border-radius:18px;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:0 8px 30px #0002}.timer strong{font-size:25px;font-variant-numeric:tabular-nums}.timer button{background:#3c4734;color:#eef4e9;padding:9px 12px}.empty{text-align:center;padding:40px 20px}.empty .symbol{font-size:42px;color:#88a96a}.tag{background:#f0f3eb;color:#6b795e;border-radius:7px;padding:5px 8px;font-size:12px}.list-item{padding:16px 0;border-bottom:1px solid #edf0e7}.list-item:last-child{border:0}dialog{border:1px solid #dce3d2;border-radius:22px;width:min(500px,94vw);padding:26px;max-height:85vh}dialog::backdrop{background:#121b1280;backdrop-filter:blur(3px)}dialog input,dialog select{width:100%;margin:6px 0 14px}dialog label{font-size:13px;color:#66715e}.exercise-choice{display:block;width:100%;text-align:left;margin:8px 0;background:#f3f5ee}.footer{font-size:12px;color:#808976;line-height:1.7;margin-top:26px}#notice{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#20271f;color:white;padding:14px 22px;border-radius:14px;z-index:5;box-shadow:0 6px 30px #0003;max-width:90vw}progress{width:100%;height:6px;accent-color:#83af45}.bar{height:9px;background:#e9efdf;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#a5cf6d}.small{font-size:12px}.stack{display:grid;gap:12px}a{color:#42632c} @media(max-width:650px){header{padding:20px}.cards{grid-template-columns:1fr}.cards.stats{grid-template-columns:repeat(3,1fr);gap:8px}.stats .card{padding:13px}.big{font-size:24px}.hero{align-items:flex-start;flex-direction:column}main{padding:24px 16px 90px}.card{padding:18px}nav{gap:2px;margin-bottom:24px}nav button{padding:11px 12px;font-size:13px}.set{gap:6px;grid-template-columns:25px 1fr 1fr 44px 25px}.badge{font-size:10px}.timer{padding:14px}.timer .muted{display:none}h1{letter-spacing:-1px}}
</style>
<header><div class="brand">ФОРМА<span>↗</span></div><div class="badge">ОСОБИСТИЙ ЩОДЕННИК</div></header>
<main><nav id="nav" aria-label="Головна навігація"></nav><div id="view"></div><div class="footer">Особистий прототип · Дані зберігаються лише в цьому браузері. Синхронізація з iPhone ще не підключена. Робіть резервні копії у вкладці «Дані».</div></main>
<dialog id="picker"><div class="row"><h2>Додати вправу</h2><button class="subtle" onclick="picker.close()" aria-label="Закрити">✕</button></div><input id="search" placeholder="Знайти вправу…" aria-label="Пошук вправ" oninput="renderChoices()"><div id="choices"></div><hr style="border:0;border-top:1px solid #eee;margin:20px 0"><label for="custom">Своя вправа</label><div class="row"><input id="custom" placeholder="Назва вправи" maxlength="100"><button class="primary" onclick="addCustom()">Додати</button></div></dialog>
<div id="notice" role="status" hidden></div>
<script>
'use strict';
const KEY='forma.personal.v1';
const catalog=['Жим штанги лежачи','Присідання зі штангою','Станова тяга','Жим гантелей на похилій лаві','Тяга верхнього блока','Тяга горизонтального блока','Жим гантелей сидячи','Підтягування','Віджимання на брусах','Згинання рук із гантелями','Розгинання рук на блоці','Жим ногами','Згинання ніг у тренажері','Розгинання ніг у тренажері','Підйоми гантелей у сторони','Підйоми на носки'];
const uid=()=>crypto.randomUUID();
let db={workouts:[],routines:[],active:null,custom:[]},tab='today',storageOK=true;
try{const saved=localStorage.getItem(KEY);if(saved){const parsed=JSON.parse(saved);if(validDB(parsed))db=parsed;else throw Error('format')}}catch(e){storageOK=false}
function validExercise(e){return e&&typeof e.name==='string'&&e.name.length<=100&&Array.isArray(e.sets)&&e.sets.length<=200&&e.sets.every(s=>s&&typeof s.id==='string'&&typeof s.done==='boolean'&&Number.isFinite(Number(s.kg))&&Number(s.kg)>=0&&Number(s.kg)<=2000&&Number.isInteger(Number(s.reps))&&Number(s.reps)>=0&&Number(s.reps)<=10000)}
function validWorkout(w){return w&&typeof w.id==='string'&&/^[a-zA-Z0-9-]{1,80}$/.test(w.id)&&typeof w.name==='string'&&w.name.length<=100&&Number.isFinite(w.started)&&Array.isArray(w.exercises)&&w.exercises.length<=100&&w.exercises.every(validExercise)}
function validDB(d){return d&&Array.isArray(d.workouts)&&d.workouts.every(w=>validWorkout(w)&&Number.isFinite(w.finished))&&Array.isArray(d.routines)&&d.routines.every(validWorkout)&&Array.isArray(d.custom)&&d.custom.every(x=>typeof x==='string'&&x.length<=100)&&(!d.active||validWorkout(d.active))}
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=n=>new Date(n).toLocaleDateString('uk-UA',{day:'numeric',month:'long'});
const completed=w=>w.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);
const volume=w=>w.exercises.reduce((n,e)=>n+e.sets.reduce((v,s)=>v+(s.done?Number(s.kg)*Number(s.reps):0),0),0);
const fmt=n=>n.toLocaleString('uk-UA');
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true;return true}catch(e){storageOK=false;toast('Не вдалося зберегти дані. Завантажте резервну копію у вкладці «Дані».');return false}}
function toast(s){const n=document.getElementById('notice');n.textContent=s;n.hidden=false;clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>n.hidden=true,4500)}
function go(t){tab=t;render()}
function render(){document.getElementById('nav').innerHTML=[['today','Тренування'],['routines','Програми'],['history','Історія'],['progress','Прогрес'],['data','Дані']].map(([id,name])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')" ${tab===id?'aria-current="page"':''}>${name}</button>`).join('');document.getElementById('view').innerHTML=({today:today,routines:routines,history:history,progress:progressView,data:dataView})[tab]();tick()}
function today(){if(db.active)return activeView();return `<div class="hero"><div><div class="eyebrow">${esc(new Date().toLocaleDateString('uk-UA',{weekday:'long',day:'numeric',month:'long'}))}</div><h1>Час стати сильнішим.</h1><p>Кожен підхід — ще один крок уперед.</p></div><button class="primary" onclick="start()">＋ Почати тренування</button></div><div class="cards stats"><div class="card"><div class="muted">Тренувань</div><div class="big">${db.workouts.length}</div></div><div class="card"><div class="muted">Підходів</div><div class="big">${fmt(db.workouts.reduce((n,w)=>n+completed(w),0))}</div></div><div class="card"><div class="muted">Обсяг, кг</div><div class="big">${fmt(db.workouts.reduce((n,w)=>n+volume(w),0))}</div></div></div><div style="margin-top:32px" class="row"><h2>Мої програми</h2><button class="subtle" onclick="go('routines')">Усі програми ↗</button></div>${db.routines.length?db.routines.slice(0,3).map(routineCard).join(''):`<div class="card empty"><div class="symbol">＋</div><h2>Ваш перший крок</h2><p>Почніть тренування, додайте вправи та збережіть його як програму для наступного разу.</p><button class="dark" onclick="start()">Створити тренування</button></div>`}`}
function start(id){if(db.active){go('today');toast('У вас уже є активне тренування.');return}const routine=db.routines.find(r=>r.id===id);db.active=routine?JSON.parse(JSON.stringify(routine)):{name:'Моє тренування',exercises:[]};Object.assign(db.active,{id:uid(),started:Date.now(),restEnd:null});db.active.exercises.forEach(e=>e.sets.forEach(s=>{s.id=uid();s.done=false}));save();go('today')}
function previous(name){for(const w of [...db.workouts].reverse()){const e=w.exercises.find(e=>e.name===name);if(e&&e.sets.some(s=>s.done))return e.sets.filter(s=>s.done).map(s=>`${s.kg} × ${s.reps}`).join(' · ')}return 'Перше тренування з цією вправою'}
function activeView(){const w=db.active;return `<div class="hero"><div><div class="eyebrow">Тренування триває · <span id="elapsed"></span></div><h1>Ваш сьогоднішній максимум.</h1></div><button class="primary" onclick="finish()">Завершити ✓</button></div><div class="card"><label class="label" for="workoutName">Назва тренування</label><input id="workoutName" class="workout-name" maxlength="100" value="${esc(w.name)}" onchange="db.active.name=this.value.trim()||'Моє тренування';save()"><div class="row"><span class="muted">${completed(w)} підходів виконано · ${fmt(volume(w))} кг</span><button class="subtle" onclick="saveRoutine()">Зберегти програму</button></div></div>${w.exercises.map((e,i)=>`<section class="card exercise"><div class="exercise-head"><div><strong>${esc(e.name)}</strong><div class="muted" style="margin-top:6px">Минулого разу: ${esc(previous(e.name))}</div></div><button class="subtle" onclick="removeExercise(${i})" aria-label="Видалити вправу ${esc(e.name)}">✕</button></div><div class="set label"><span>№</span><span style="text-align:center">кг</span><span style="text-align:center">Повтори</span><span>Готово</span><span></span></div>${e.sets.map((s,j)=>`<div class="set ${s.done?'done':''}"><span class="muted">${j+1}</span><input type="number" inputmode="decimal" min="0" max="2000" step="0.5" aria-label="Вага, підхід ${j+1}" value="${s.kg}" onchange="updateSet(${i},${j},'kg',this)"><input type="number" inputmode="numeric" min="0" max="10000" step="1" aria-label="Повторення, підхід ${j+1}" value="${s.reps}" onchange="updateSet(${i},${j},'reps',this)"><button class="check" aria-label="Позначити підхід ${j+1}" aria-pressed="${s.done}" onclick="toggle(${i},${j})">${s.done?'✓':'○'}</button><button class="subtle" style="padding:4px" onclick="removeSet(${i},${j})" aria-label="Видалити підхід ${j+1}">×</button></div>`).join('')}<button class="subtle" style="width:100%;margin-top:12px" onclick="addSet(${i})">＋ Додати підхід</button></section>`).join('')}<div class="actions" style="margin:22px 0"><button class="dark" onclick="openPicker()">＋ Додати вправу</button><button class="danger" onclick="cancelWorkout()">Скасувати</button></div><div class="timer"><div><div class="label" style="color:#bfcbb5">Відпочинок</div><strong id="countdown">01:30</strong></div><label class="muted" for="restDuration">Після кожного підходу</label><select id="restDuration" aria-label="Тривалість відпочинку" onchange="db.active.restSeconds=Number(this.value);save()">${[30,60,90,120,180].map(n=>`<option value="${n}" ${(w.restSeconds||90)===n?'selected':''}>${n} с</option>`).join('')}</select><button onclick="db.active.restEnd=db.active.restEnd?null:Date.now()+(db.active.restSeconds||90)*1000;save();tick()" id="timerControl">Старт</button></div>`}
function updateSet(i,j,key,input){const n=Number(input.value);if(input.value===''||!Number.isFinite(n)||n<0||n>(key==='kg'?2000:10000)||(key==='reps'&&!Number.isInteger(n))){input.value=db.active.exercises[i].sets[j][key];toast('Введіть коректне додатне число або 0.');return}db.active.exercises[i].sets[j][key]=n;save()}
function toggle(i,j){const s=db.active.exercises[i].sets[j];if(!s.done&&s.reps===0){toast('Вкажіть кількість повторень перед завершенням підходу.');return}s.done=!s.done;if(s.done)db.active.restEnd=Date.now()+(db.active.restSeconds||90)*1000;save();render()}
function addSet(i){const sets=db.active.exercises[i].sets,last=sets.at(-1);sets.push({id:uid(),kg:last?.kg||0,reps:last?.reps||10,done:false});save();render()}
function removeSet(i,j){db.active.exercises[i].sets.splice(j,1);save();render()}
function removeExercise(i){if(confirm('Видалити вправу та її підходи?')){db.active.exercises.splice(i,1);save();render()}}
function openPicker(){document.getElementById('search').value='';renderChoices();document.getElementById('picker').showModal()}
function renderChoices(){const q=document.getElementById('search').value.toLocaleLowerCase();window.filtered=[...new Set([...catalog,...db.custom])].filter(n=>n.toLocaleLowerCase().includes(q));document.getElementById('choices').innerHTML=filtered.length?filtered.map((n,i)=>`<button class="exercise-choice" onclick="addExercise(filtered[${i}])">${esc(n)} <span style="float:right">＋</span></button>`).join(''):'<p>Не знайдено. Додайте свою вправу нижче.</p>'}
function addExercise(name){if(!db.active)return;const last=[...db.workouts].reverse().flatMap(w=>w.exercises).find(e=>e.name===name);db.active.exercises.push({name,sets:last?last.sets.filter(s=>s.done).map(s=>({...s,id:uid(),done:false})):Array.from({length:3},()=>({id:uid(),kg:0,reps:10,done:false}))});save();document.getElementById('picker').close();render()}
function addCustom(){const input=document.getElementById('custom'),n=input.value.trim();if(!n)return;db.custom.push(n);input.value='';addExercise(n)}
function finish(){if(!completed(db.active)){toast('Виконайте хоча б один підхід, щоб зберегти тренування.');return}if(!confirm('Завершити тренування та зберегти результат в історію?'))return;const w=JSON.parse(JSON.stringify(db.active));w.finished=Date.now();w.restEnd=null;db.workouts.push(w);db.active=null;save();go('history');toast('Тренування збережено. Гарна робота!')}
function cancelWorkout(){if(confirm('Скасувати поточне тренування? Його підходи не потраплять в історію.')){db.active=null;save();render()}}
function saveRoutine(){if(!db.active.exercises.length){toast('Спочатку додайте хоча б одну вправу.');return}const name=prompt('Назва програми',db.active.name);if(!name?.trim())return;const r=JSON.parse(JSON.stringify(db.active));Object.assign(r,{id:uid(),name:name.trim().slice(0,100),restEnd:null});r.exercises.forEach(e=>e.sets.forEach(s=>s.done=false));db.routines.push(r);save();toast('Програму збережено')}
function routineCard(r){return `<div class="card"><div class="row"><div><span class="tag">${r.exercises.length} вправ</span><h2 style="margin-top:13px">${esc(r.name)}</h2><p class="small">${r.exercises.map(e=>esc(e.name)).join(' · ')}</p></div><button class="subtle" onclick="deleteRoutine('${r.id}')" aria-label="Видалити програму">✕</button></div><button class="primary" onclick="start('${r.id}')">Почати тренування ↗</button></div>`}
function routines(){return `<div class="hero"><div><div class="eyebrow">Ваш план</div><h1>Програми тренувань.</h1><p>Збережені вправи та підходи для наступного візиту в зал.</p></div><button class="primary" onclick="start()">＋ Створити через тренування</button></div>${db.routines.length?db.routines.map(routineCard).join(''):'<div class="card empty"><h2>Поки що тут чистий аркуш</h2><p>Додайте вправи в тренуванні та натисніть «Зберегти програму».</p></div>'}`}
function deleteRoutine(id){if(confirm('Видалити цю програму?')){db.routines=db.routines.filter(r=>r.id!==id);save();render()}}
function history(){return `<div class="eyebrow">Кожне зусилля має значення</div><h1>Ваша історія.</h1><p>Усі збережені тренування, від першого до останнього.</p>${db.workouts.length?[...db.workouts].reverse().map(w=>`<details class="card"><summary style="cursor:pointer"><strong>${esc(w.name)}</strong><span class="muted" style="float:right">${date(w.started)}</span><div class="muted" style="margin-top:10px">${completed(w)} підходів · ${fmt(volume(w))} кг · ${Math.max(1,Math.round((w.finished-w.started)/60000))} хв</div></summary><div style="margin-top:20px">${w.exercises.map(e=>`<div class="list-item"><strong>${esc(e.name)}</strong><p class="small">${e.sets.filter(s=>s.done).map(s=>`${s.kg} кг × ${s.reps}`).join(' · ')||'Немає виконаних підходів'}</p></div>`).join('')}</div></details>`).join(''):'<div class="card empty"><div class="symbol">↗</div><h2>Тут буде ваша історія</h2><p>Завершіть перше тренування, щоб побачити результат.</p><button class="dark" onclick="start()">Почати</button></div>'}`}
function progressView(){const names=[...new Set(db.workouts.flatMap(w=>w.exercises.filter(e=>e.sets.some(s=>s.done)).map(e=>e.name)))];return `<div class="eyebrow">Сила в послідовності</div><h1>Особистий прогрес.</h1><p>Максимальна вага у виконаному підході та обсяг останніх тренувань.</p><div class="card"><h2>Ваші рекорди</h2>${names.length?names.map(n=>{const best=Math.max(...db.workouts.flatMap(w=>w.exercises.filter(e=>e.name===n).flatMap(e=>e.sets.filter(s=>s.done).map(s=>s.kg))));return `<div class="row list-item"><span>${esc(n)}</span><strong>${best} кг</strong></div>`}).join(''):'<p>Рекорди з’являться після першого завершеного тренування.</p>'}</div><div class="card"><h2>Обсяг тренувань</h2><p class="small">Сума ваги × повторення для виконаних підходів; вага тіла не враховується.</p>${db.workouts.slice(-8).map(w=>`<div class="list-item"><div class="row small"><span>${date(w.started)} · ${esc(w.name)}</span><strong>${fmt(volume(w))} кг</strong></div><div class="bar" style="margin-top:10px"><i style="width:${volume(w)/Math.max(1,...db.workouts.slice(-8).map(volume))*100}%"></i></div></div>`).join('')||'<p>Ще немає даних.</p>'}</div>`}
function dataView(){return `<div class="eyebrow">Ваші дані</div><h1>Усе під контролем.</h1><div class="card"><h2>Резервна копія</h2><p>Завантажте свої тренування та програми у файл. Його можна імпортувати в цьому прототипі в іншому браузері. Це ручне перенесення даних.</p><div class="actions"><button class="primary" onclick="exportData()">↓ Завантажити копію</button><button onclick="document.getElementById('import').click()">↑ Імпортувати копію</button><input hidden id="import" type="file" accept="application/json,.json" onchange="importData(this.files[0]);this.value=''" style="display:none"></div></div><div class="card"><h2>Статус особистої версії</h2><p>Збереження в цьому браузері: <strong>${storageOK?'доступне':'помилка — завантажте копію'}</strong>.<br>Хмарна синхронізація та застосунок для iPhone ще не підключені. Очищення даних браузера видалить локальні записи. Після першого відкриття HTML-файл можна використовувати без інтернету.</p></div>`}
function exportData(){const url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=`forma-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importData(file){if(!file)return;try{if(file.size>10*1024*1024)throw Error();const data=JSON.parse(await file.text());if(!validDB(data))throw Error();if(!confirm('Замінити поточні дані вмістом резервної копії? Перед цим рекомендуємо завантажити поточну копію.'))return;db=data;save();render();toast('Резервну копію імпортовано')}catch(e){toast('Файл не є коректною резервною копією Форма. Дані не змінено.')}}
function tick(){if(!db.active||tab!=='today')return;const elapsed=document.getElementById('elapsed');if(elapsed){const m=Math.floor((Date.now()-db.active.started)/60000);elapsed.textContent=`${Math.max(0,m)} хв`}const counter=document.getElementById('countdown'),control=document.getElementById('timerControl');if(!counter)return;let left=db.active.restEnd?Math.max(0,Math.ceil((db.active.restEnd-Date.now())/1000)):(db.active.restSeconds||90);if(db.active.restEnd&&left===0){db.active.restEnd=null;save();toast('Відпочинок завершено. Час наступного підходу.');if(navigator.vibrate)navigator.vibrate([100,100,100])}counter.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;control.textContent=db.active.restEnd?'Стоп':'Старт'}
render();setInterval(tick,1000);if(!storageOK)toast('Не вдалося прочитати збережені дані. Перевірте налаштування браузера або імпортуйте копію.');
</script></html>
